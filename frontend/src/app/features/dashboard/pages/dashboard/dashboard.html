<div class="dashboard-content">
    <mat-toolbar color="primary" class="header-toolbar">
        <span>Admin Dashboard</span>
        <span class="spacer"></span>
        <span class="user-greeting">Welcome, <strong>{{ loggedInUser() }}</strong></span>
        <button mat-icon-button (click)="logout()" title="Logout">
            <mat-icon>logout</mat-icon>
        </button>
    </mat-toolbar>

    @if (isLoading()) {
    <div class="table-loading-shimmer">Processing dynamic query requests...</div>
    }

    <div class="table-actions-container">
        <div class="filter-controls">
            <mat-form-field appearance="outline" class="search-field">
                <mat-label>Search matching value</mat-label>

                <input matInput [ngModel]="searchTerm()" (ngModelChange)="onSearchChange($event)"
                    placeholder="Type here..." />

                @if (searchTerm()) {
                <button matSuffix mat-icon-button (click)="clearSearch()">
                    <mat-icon>clear</mat-icon>
                </button>
                }
            </mat-form-field>
        </div>

        <button mat-raised-button color="accent" (click)="addUser()">
            <mat-icon>add</mat-icon> Add User
        </button>
    </div>

    <div class="mat-elevation-z8 responsive-table-container">
        <table mat-table [dataSource]="dataSource" matSort>

            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
                <td mat-cell *matCellDef="let element"> {{element.id}} </td>
            </ng-container>

            <ng-container matColumnDef="username">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                <td mat-cell *matCellDef="let element"> {{element.username}} </td>
            </ng-container>

            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
                <td mat-cell *matCellDef="let element"> {{element.email}} </td>
            </ng-container>

            <ng-container matColumnDef="mobile">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Mobile No. </th>
                <td mat-cell *matCellDef="let element"> {{element.mobile}} </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Actions </th>
                <td mat-cell *matCellDef="let element">
                    <button mat-icon-button color="primary" (click)="editUser(element)" title="Edit">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="deleteUser(element.id)" title="Delete">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [length]="totalRecords()" [pageSize]="pageSize()" [pageSizeOptions]="[5, 10, 50, 100]"
            (page)="onPageChange($event)" showFirstLastButtons>
        </mat-paginator>
    </div>
</div>
