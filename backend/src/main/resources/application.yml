spring:
  application:
    name: angular-spring-boot-starter
  datasource:
    url: jdbc:mysql://localhost:3306/blog
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect